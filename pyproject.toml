[project]
name = "equipment-cost-forecasting"
version = "0.1.0"
description = "Forecasting equipment acquisition costs from commodity prices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.15.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
