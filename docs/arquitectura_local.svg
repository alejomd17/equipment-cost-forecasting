<svg width="100%" viewBox="0 0 680 740" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura implementada: pipeline local y agente</title>
<desc>Cuatro capas: datos crudos, pipeline orquestado por make o uv run, artefactos versionados, y el agente, donde Streamlit intercambia pregunta y respuesta con el grafo ReAct, que a su vez consulta la rama interna de tools o la externa de Tavily y mantiene el estado en MemorySaver.</desc>
