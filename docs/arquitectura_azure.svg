<svg width="100%" viewBox="0 0 680 790" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Arquitectura propuesta en Azure</title>
<desc>Cinco capas: ingesta orquestada por Data Factory, almacenamiento, procesamiento y servicio con Azure Functions en contenedor, dos opciones de consumo del agente, y plataforma de soporte. Las cajas con borde punteado entran solo si crece el volumen o la complejidad.</desc>
